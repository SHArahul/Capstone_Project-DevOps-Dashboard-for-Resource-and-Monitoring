apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-api
  template:
    metadata:
      labels:
        app: python-api
    spec:
      containers:
      - name: python-api
        image: 975050024946.dkr.ecr.ca-central-1.amazonaws.com/capstone-gp-a:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          value: "postgresql://postgres:postgres_pass@postgres-svc:5432/postgres"

---
apiVersion: v1
kind: Service
metadata:
  name: python-api-svc
spec:
  type: ClusterIP
  selector:
    app: python-api
  ports:
  - port: 8000
    targetPort: 8000