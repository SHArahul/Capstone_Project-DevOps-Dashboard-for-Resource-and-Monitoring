############################################
# DATASOURCES CONFIG
############################################
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: AWS-Cost-DB
        type: postgres
        access: proxy
        url: ${DB_HOST}:5432
        user: ${DB_USER}
        secureJsonData:
          password: ${DB_PASSWORD}
        jsonData:
          database: ${DB_NAME}
          sslmode: disable

      - name: Azure-Cost-DB
        type: postgres
        access: proxy
        url: ${DB_HOST}:5432
        user: ${DB_USER}
        secureJsonData:
          password: ${DB_PASSWORD}
        jsonData:
          database: ${AZURE_DB_NAME}
          sslmode: disable

      - name: GCP-Cost-DB
        type: postgres
        access: proxy
        url: ${DB_HOST}:5432
        user: ${DB_USER}
        secureJsonData:
          password: ${DB_PASSWORD}
        jsonData:
          database: ${GCP_DB_NAME}
          sslmode: disable

---
############################################
# DASHBOARD PROVIDER
############################################
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards

---
############################################
# AWS DASHBOARD
############################################
apiVersion: v1
kind: ConfigMap
metadata:
  name: aws-dashboard
data:
  aws-cost.json: |
    {
      "title": "AWS Cost Dashboard",
      "schemaVersion": 36,
      "version": 1,
      "panels": []
    }

---
############################################
# AZURE DASHBOARD
############################################
apiVersion: v1
kind: ConfigMap
metadata:
  name: azure-dashboard
data:
  azure-cost.json: |
    {
      "title": "Azure Cost Dashboard",
      "schemaVersion": 36,
      "version": 1,
      "panels": []
    }

---
############################################
# GCP DASHBOARD
############################################
apiVersion: v1
kind: ConfigMap
metadata:
  name: gcp-dashboard
data:
  gcp-cost.json: |
    {
      "title": "GCP Cost Dashboard",
      "schemaVersion": 36,
      "version": 1,
      "panels": []
    }

---
############################################
# GRAFANA SERVICE
############################################
apiVersion: v1
kind: Service
metadata:
  name: grafana-svc
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 32000

---
############################################
# GRAFANA STATEFULSET
############################################
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: grafana
spec:
  serviceName: grafana-svc
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:10.4.1
        ports:
          - containerPort: 3000
        envFrom:
          - secretRef:
              name: postgres-secret
        volumeMounts:
          - name: grafana-storage
            mountPath: /var/lib/grafana
          - name: datasources
            mountPath: /etc/grafana/provisioning/datasources
          - name: dashboard-provider
            mountPath: /etc/grafana/provisioning/dashboards
          - name: dashboards
            mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          projected:
            sources:
              - configMap:
                  name: aws-dashboard
              - configMap:
                  name: azure-dashboard
              - configMap:
                  name: gcp-dashboard
  volumeClaimTemplates:
    - metadata:
        name: grafana-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi